openapi: 3.0.0
info:
  title: hermes-relay-api
  version: "1"
  description: CQRS-based API for qualitative coding system
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /commands:
    post:
      summary: Execute command(s)
      description: Execute a single command or batch of commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Command'
                - type: array
                  items:
                    $ref: '#/components/schemas/Command'
            examples:
              createCode:
                summary: Create a new code
                value:
                  action: CreateCode
                  type: Command
                  aggregateType: Code
                  payload:
                    project_id: proj-123
                    slug: topic:climate
                    color: green-500
                    reasoning: Climate change related content
              updateCode:
                summary: Update an existing code
                value:
                  action: UpdateCode
                  type: Command
                  aggregateType: Code
                  aggregateId: code-456
                  payload:
                    color: emerald-600
                    reasoning: Updated environmental coverage
              createFile:
                summary: Create a new file
                value:
                  action: Create
                  type: Command
                  aggregateType: File
                  payload:
                    project_id: proj-123
                    name: interview-transcript.md
                    title: Interview with Expert
                    summary: Discussion about climate policy
                    content: "# Interview Transcript\n\nQ: What are your thoughts on..."
              codeFile:
                summary: Apply coding to file chunks
                value:
                  action: CodeFile
                  type: Command
                  aggregateType: File
                  aggregateId: file-789
                  payload:
                    actions:
                      - code_slug: topic:climate
                        action: SetCoding
                        chunk_id: chunk-1
                        texts:
                          - text: Discussion about rising temperatures
                            ai_reason: Mentions climate metrics
                            comment: Key finding
              createProject:
                summary: Create a new project
                value:
                  action: CreateProject
                  type: Command
                  aggregateType: Project
                  payload:
                    name: Climate Research 2024
              batchCommands:
                summary: Execute multiple commands
                value:
                  - action: CreateCode
                    type: Command
                    aggregateType: Code
                    payload:
                      project_id: proj-123
                      slug: topic:policy
                      color: blue-500
                      reasoning: Policy discussions
                  - action: CreateCode
                    type: Command
                    aggregateType: Code
                    payload:
                      project_id: proj-123
                      slug: sentiment:positive
                      color: green-400
                      reasoning: Positive sentiment indicators
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DomainEvent'
                  - $ref: '#/components/schemas/BatchResponse'
              examples:
                singleSuccess:
                  summary: Single command result
                  value:
                    id: evt-abc123
                    action: CreatedCode
                    type: DomainEvent
                    aggregateId: code-new-123
                    aggregateType: Code
                    payload:
                      project_id: proj-123
                      slug: topic:climate
                      color: green-500
                      reasoning: Climate change related content
                    timestamp: "2024-01-15T10:30:00Z"
                batchSuccess:
                  summary: Batch command results
                  value:
                    total: 2
                    success_count: 2
                    failure_count: 0
                    results:
                      - index: 0
                        success: true
                        result:
                          id: evt-abc123
                          action: CreatedCode
                          type: DomainEvent
                          aggregateId: code-123
                          aggregateType: Code
                      - index: 1
                        success: true
                        result:
                          id: evt-abc124
                          action: CreatedCode
                          type: DomainEvent
                          aggregateId: code-124
                          aggregateType: Code
        '400':
          description: Invalid command or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Validation failed
                fields:
                  slug: must match pattern category:value
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Internal server error

  /queries/files/:
    get:
      summary: List all files
      description: Returns base file information (without content)
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaseFile'
              example:
                - id: file-123
                  project_id: proj-456
                  name: interview-01.md
                  title: Expert Interview
                  summary: Climate policy discussion
                  time: "2024-01-15T14:30:00Z"
                - id: file-124
                  project_id: proj-456
                  name: interview-02.md
                  title: Stakeholder Interview
                  summary: Community perspectives
                  time: "2024-01-16T09:00:00Z"

  /queries/files/{id}:
    get:
      summary: Get file content
      description: Returns file content as markdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: file-123
      responses:
        '200':
          description: File content
          content:
            text/markdown:
              schema:
                type: string
              example: |
                # Expert Interview

                Q: What are your thoughts on current climate policy?
                A: I believe we need stronger measures...
        '404':
          description: File not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queries/files/{id}/chunks/{index}:
    get:
      summary: Get file chunk
      description: Returns a specific chunk with coding information
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: file-123
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 5
      responses:
        '200':
          description: File chunk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkResult'
              example:
                chunk:
                  id: chunk-5
                  content: "Q: What are your thoughts on current climate policy?\nA: I believe we need stronger measures to address the urgency of climate change."
                  codes:
                    - start_index: 89
                      end_index: 115
                      code_slug: topic:climate
                      text: urgency of climate change
                      ai_reason: Direct mention of climate urgency
                      comment: Key theme
                chunk_index: 5
                total_chunks: 12
                has_next: true
        '404':
          description: File or chunk not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queries/codes/:
    get:
      summary: List all codes
      description: Returns all codes in the system
      responses:
        '200':
          description: List of codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Code'
              example:
                - id: code-123
                  project_id: proj-456
                  slug: topic:climate
                  color: green-500
                  reasoning: Climate change related content
                - id: code-124
                  project_id: proj-456
                  slug: sentiment:positive
                  color: emerald-400
                  reasoning: Positive sentiment indicators

  /queries/codes/{id}:
    get:
      summary: Get code by ID
      description: Returns a specific code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: code-123
      responses:
        '200':
          description: Code details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'
              example:
                id: code-123
                project_id: proj-456
                slug: topic:climate
                color: green-500
                reasoning: Climate change related content
        '404':
          description: Code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queries/codes/slug/{slug}:
    get:
      summary: Get code by slug
      description: Returns a code by its slug identifier
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9-]+:[a-z0-9-]+$'
          example: topic:climate
      responses:
        '200':
          description: Code details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'
              example:
                id: code-123
                project_id: proj-456
                slug: topic:climate
                color: green-500
                reasoning: Climate change related content
        '404':
          description: Code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /queries/projects/:
    get:
      summary: List all projects
      description: Returns all projects with their file and code IDs
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              example:
                - id: proj-123
                  name: Climate Research 2024
                  code_ids:
                    - code-456
                    - code-457
                  file_ids:
                    - file-789
                    - file-790

  /queries/projects/{id}:
    get:
      summary: Get project by ID
      description: Returns a specific project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: proj-123
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: proj-123
                name: Climate Research 2024
                code_ids:
                  - code-456
                  - code-457
                file_ids:
                  - file-789
                  - file-790
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ws/:
    get:
      summary: WebSocket connection
      description: Bidirectional WebSocket for real-time command execution and event streaming
      responses:
        '101':
          description: WebSocket connection established

components:
  schemas:
    Command:
      type: object
      required:
        - action
        - type
        - aggregateType
      properties:
        id:
          type: string
          description: Optional command ID
        action:
          type: string
          description: Command action name
          enum:
            - CreateCode
            - UpdateCode
            - DeleteCode
            - Create
            - CodeFile
            - ClearCoding
            - MergeCodes
            - CreateProject
        type:
          type: string
          enum:
            - Command
        aggregateId:
          type: string
          description: Required for update/delete operations, omit for create
        aggregateType:
          type: string
          enum:
            - Code
            - File
            - Project
        payload:
          type: object
          description: Command-specific payload
        causationId:
          type: string
          description: Optional causation tracking ID
        timestamp:
          type: string
          format: date-time

    DomainEvent:
      type: object
      required:
        - action
        - type
        - aggregateType
        - aggregateId
      properties:
        id:
          type: string
        action:
          type: string
          description: Event action name
        type:
          type: string
          enum:
            - DomainEvent
        aggregateId:
          type: string
        aggregateType:
          type: string
        payload:
          type: object
        causationId:
          type: string
        timestamp:
          type: string
          format: date-time

    BatchResponse:
      type: object
      required:
        - total
        - success_count
        - failure_count
        - results
      properties:
        total:
          type: integer
          description: Total number of commands
        success_count:
          type: integer
          description: Number of successful commands
        failure_count:
          type: integer
          description: Number of failed commands
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchResult'

    BatchResult:
      type: object
      required:
        - index
        - success
      properties:
        index:
          type: integer
          description: Index of command in batch
        success:
          type: boolean
          description: Whether command succeeded
        result:
          $ref: '#/components/schemas/DomainEvent'
        error:
          type: string
          description: Error message if failed

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

    Code:
      type: object
      required:
        - id
        - project_id
        - slug
        - color
        - reasoning
      properties:
        id:
          type: string
          example: code-123
        project_id:
          type: string
          example: proj-456
        slug:
          type: string
          pattern: '^[a-z0-9-]+:[a-z0-9-]+$'
          example: topic:climate
          description: Format is category:value (lowercase, alphanumeric with hyphens)
        color:
          type: string
          example: green-500
          description: Color identifier for UI display
        reasoning:
          type: string
          example: Climate change related content
          description: Explanation for this code's purpose

    CreateCodePayload:
      type: object
      required:
        - project_id
        - slug
        - color
        - reasoning
      properties:
        project_id:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9-]+:[a-z0-9-]+$'
        color:
          type: string
        reasoning:
          type: string

    UpdateCodePayload:
      type: object
      properties:
        color:
          type: string
        reasoning:
          type: string

    DeleteCodePayload:
      type: object
      required:
        - project_id
      properties:
        project_id:
          type: string

    BaseFile:
      type: object
      required:
        - id
        - project_id
        - name
        - title
      properties:
        id:
          type: string
          example: file-123
        project_id:
          type: string
          example: proj-456
        name:
          type: string
          example: interview-transcript.md
        title:
          type: string
          maxLength: 200
          example: Expert Interview
        summary:
          type: string
          maxLength: 1500
          example: Discussion about climate policy
        time:
          type: string
          format: date-time

    CreateFilePayload:
      type: object
      required:
        - project_id
        - name
        - title
        - content
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        title:
          type: string
          maxLength: 200
        summary:
          type: string
          maxLength: 1500
        time:
          type: string
          format: date-time
        content:
          type: string
          description: Full file content

    CodeFilePayload:
      type: object
      required:
        - actions
      properties:
        actions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CodingAction'

    CodingAction:
      type: object
      required:
        - code_slug
        - action
        - texts
        - chunk_id
      properties:
        code_slug:
          type: string
          pattern: '^[a-z0-9-]+:[a-z0-9-]+$'
          example: topic:climate
        action:
          type: string
          enum:
            - SetCoding
            - AppendCoding
            - RemoveCoding
          description: |
            - SetCoding: Replace all codes in chunk
            - AppendCoding: Add codes to chunk
            - RemoveCoding: Remove codes from chunk
        texts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CodedSectionAttributes'
        chunk_id:
          type: string
          example: chunk-5

    CodedSectionAttributes:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 1500
          example: urgency of climate change
        ai_reason:
          type: string
          maxLength: 1500
          example: Direct mention of climate urgency
        comment:
          type: string
          maxLength: 1500
          example: Key theme in interview

    MergeCodesPayload:
      type: object
      required:
        - source
        - target
      properties:
        source:
          type: string
          pattern: '^[a-z0-9-]+:[a-z0-9-]+$'
          example: topic:climate-old
          description: Source code slug (will be merged into target)
        target:
          type: string
          pattern: '^[a-z0-9-]+:[a-z0-9-]+$'
          example: topic:climate
          description: Target code slug

    Chunk:
      type: object
      required:
        - id
        - content
        - codes
      properties:
        id:
          type: string
          example: chunk-5
        content:
          type: string
          example: "Q: What are your thoughts?\nA: I believe..."
        codes:
          type: array
          items:
            $ref: '#/components/schemas/CodedSection'

    CodedSection:
      type: object
      required:
        - start_index
        - end_index
        - code_slug
        - text
      properties:
        start_index:
          type: integer
          minimum: 0
          example: 89
          description: Character index where coded section starts
        end_index:
          type: integer
          example: 115
          description: Character index where coded section ends (exclusive)
        code_slug:
          type: string
          pattern: '^[a-z0-9-]+:[a-z0-9-]+$'
          example: topic:climate
        text:
          type: string
          maxLength: 1500
          example: urgency of climate change
        ai_reason:
          type: string
          maxLength: 1500
          example: Direct mention of climate urgency
        comment:
          type: string
          maxLength: 1500
          example: Key theme

    ChunkResult:
      type: object
      required:
        - chunk
        - chunk_index
        - total_chunks
        - has_next
      properties:
        chunk:
          $ref: '#/components/schemas/Chunk'
        chunk_index:
          type: integer
          minimum: 1
          example: 5
          description: Current chunk index (1-based)
        total_chunks:
          type: integer
          example: 12
          description: Total number of chunks in file
        has_next:
          type: boolean
          example: true
          description: Whether there is a next chunk

    Project:
      type: object
      required:
        - id
        - name
        - code_ids
        - file_ids
      properties:
        id:
          type: string
          example: proj-123
        name:
          type: string
          example: Climate Research 2024
        code_ids:
          type: array
          items:
            type: string
          example:
            - code-456
            - code-457
        file_ids:
          type: array
          items:
            type: string
          example:
            - file-789
            - file-790

    CreateProjectPayload:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Climate Research 2024
