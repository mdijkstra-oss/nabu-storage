openapi: 3.0.3
info:
  title: Hermes Relay API
  description: |
    Event-sourced qualitative data analysis platform using CQRS architecture.

    ## Architecture
    - Commands modify state and generate domain events
    - Events are stored and can be replayed to rebuild state
    - Queries read from materialized projections
    - WebSocket provides real-time event streaming

    ## Entities
    - **Project**: Research workspace with phases (explore, code, validate, analyze)
    - **Code**: Qualitative coding scheme with examples and criteria
    - **File**: Documents (corpus), codebooks, memos with coded sections
    - **Chart**: Data visualizations with flexible specifications
  version: 1.0.0
  contact:
    name: Hermes Relay Support

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Commands
    description: State modification operations
  - name: Schemas
    description: Entity JSON schemas
  - name: Projects
    description: Project queries
  - name: Files
    description: File queries and search
  - name: Codes
    description: Code queries and sections
  - name: Charts
    description: Chart queries
  - name: WebSocket
    description: Real-time event streaming

paths:
  /commands:
    post:
      tags: [Commands]
      summary: Execute command(s)
      description: |
        Execute single command or batch of commands.
        - Single: Send command object
        - Batch: Send array of commands
        - Returns 207 for partial batch failures
      operationId: executeCommands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Message'
                - type: array
                  items:
                    $ref: '#/components/schemas/Message'
            examples:
              singleCommand:
                summary: Single command
                value:
                  action: CreateProject
                  type: Command
                  aggregate_type: Project
                  aggregate_id: proj_01jdqx8h9m0n2p3q4r5s6t7u8v
                  payload:
                    name: Interview Study 2024
                    description: Analysis of participant interviews
                    phase: explore
                  actor:
                    user_id: patient-zero
                    actor_type: human
              batchCommands:
                summary: Batch commands
                value:
                  - action: CreateCode
                    type: Command
                    aggregate_type: Code
                    aggregate_id: code_01jdqx8h9m0n2p3q4r5s6t7u8v
                    payload:
                      project_id: proj_01jdqx8h9m0n2p3q4r5s6t7u8v
                      slug: emotion:anxiety
                      color: red
                      definition: Expressions of worry or fear
                    actor:
                      user_id: patient-zero
                      actor_type: human
                  - action: CreateCode
                    type: Command
                    aggregate_type: Code
                    aggregate_id: code_01jdqx8h9m0n2p3q4r5s6t7u8w
                    payload:
                      project_id: proj_01jdqx8h9m0n2p3q4r5s6t7u8v
                      slug: theme:power-dynamics
                      color: purple
                      definition: Discussions of authority and control
                    actor:
                      user_id: patient-zero
                      actor_type: human
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: evt_01jdqx8h9m0n2p3q4r5s6t7u8x
                action: CreatedProject
                type: DomainEvent
                aggregate_id: proj_01jdqx8h9m0n2p3q4r5s6t7u8v
                aggregate_type: Project
                payload:
                  name: Interview Study 2024
                  description: Analysis of participant interviews
                  phase: explore
                  pinned: false
                actor:
                  user_id: patient-zero
                  actor_type: human
                causation_id: cmd_01jdqx8h9m0n2p3q4r5s6t7u8w
                timestamp: '2024-01-15T10:30:00Z'
                version: 1
        '207':
          description: Batch with partial failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /ws/{projectId}:
    get:
      tags: [WebSocket]
      summary: WebSocket event stream
      description: |
        Real-time event streaming for project changes.
        Upgrade to WebSocket to receive events as they occur.
      operationId: websocketStream
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9_]{26,27}$'
          example: proj_01jdqx8h9m0n2p3q4r5s6t7u8v
      responses:
        '101':
          description: Switching Protocols - WebSocket connection established

  /schemas/project:
    get:
      tags: [Schemas]
      summary: Get Project schema
      operationId: getProjectSchema
      responses:
        '200':
          description: JSON Schema for Project entity
          content:
            application/json:
              schema:
                type: object

  /schemas/file:
    get:
      tags: [Schemas]
      summary: Get File schema
      operationId: getFileSchema
      responses:
        '200':
          description: JSON Schema for File entity
          content:
            application/json:
              schema:
                type: object

  /schemas/code:
    get:
      tags: [Schemas]
      summary: Get Code schema
      operationId: getCodeSchema
      responses:
        '200':
          description: JSON Schema for Code entity
          content:
            application/json:
              schema:
                type: object

  /schemas/chart:
    get:
      tags: [Schemas]
      summary: Get Chart schema
      operationId: getChartSchema
      responses:
        '200':
          description: JSON Schema for Chart entity
          content:
            application/json:
              schema:
                type: object

  /queries/projects:
    get:
      tags: [Projects]
      summary: List all projects
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginationResult_ProjectView'

  /queries/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project details
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '404':
          $ref: '#/components/responses/NotFound'

  /queries/projects/{projectId}/events:
    get:
      tags: [Projects]
      summary: Get project events
      operationId: getProjectEvents
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/SinceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ActorType'
      responses:
        '200':
          description: Event stream with cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorResult_Message'

  /queries/projects/{projectId}/search:
    get:
      tags: [Files]
      summary: Search project files
      operationId: searchProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: q
          in: query
          required: true
          description: Search query (minimum 3 characters)
          schema:
            type: string
            minLength: 3
          example: anxiety
        - name: context
          in: query
          description: Number of context sentences around match
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 1
        - $ref: '#/components/parameters/SinceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results with cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorResult_SearchResult'

  /queries/projects/{projectId}/files:
    get:
      tags: [Files]
      summary: List project files
      operationId: listFiles
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileSummary'

  /queries/projects/{projectId}/files/{id}:
    get:
      tags: [Files]
      summary: Get file details
      operationId: getFile
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: File details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /queries/projects/{projectId}/files/{id}/parts:
    get:
      tags: [Files]
      summary: Get file content in parts
      description: |
        Retrieve file content in paginated chunks for large files.
        Each part contains a portion of content and associated coded sections.
      operationId: getFileParts
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Id'
        - name: page
          in: query
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: File part with content and codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePartResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /queries/projects/{projectId}/codebook:
    get:
      tags: [Files]
      summary: Get project codebook
      operationId: getCodebook
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Codebook content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /queries/projects/{projectId}/codes:
    get:
      tags: [Codes]
      summary: List project codes
      operationId: listCodes
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginationResult_Code'

  /queries/projects/{projectId}/codes/{id}:
    get:
      tags: [Codes]
      summary: Get code details
      operationId: getCode
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Code details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Code'
        '404':
          $ref: '#/components/responses/NotFound'

  /queries/projects/{projectId}/codes/{id}/sections:
    get:
      tags: [Codes]
      summary: Get coded sections for code
      operationId: getCodeSections
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: confidence
          in: query
          description: Filter by confidence level
          schema:
            type: string
            enum: [high, medium, low]
        - $ref: '#/components/parameters/ActorType'
      responses:
        '200':
          description: Paginated coded sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResult_CodedSectionView'
        '404':
          $ref: '#/components/responses/NotFound'

  /queries/projects/{projectId}/charts:
    get:
      tags: [Charts]
      summary: List project charts
      operationId: listCharts
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated list of charts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginationResult_Chart'

  /queries/projects/{projectId}/charts/{id}:
    get:
      tags: [Charts]
      summary: Get chart details
      operationId: getChart
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Chart details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chart'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9_]{26,27}$'
      example: proj_01jdqx8h9m0n2p3q4r5s6t7u8v

    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9_]{26,27}$'
      example: file_01jdqx8h9m0n2p3q4r5s6t7u8v

    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: page_size
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SinceId:
      name: since_id
      in: query
      description: Cursor for pagination (ID to start after)
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    ActorType:
      name: actor_type
      in: query
      description: Filter by actor type
      schema:
        type: string
        enum: [human, llm, system]

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: 'validation failed: Slug must match code slug format (lowercase with colon and optional dashes)'
            fields:
              Slug: 'Slug must match code slug format (lowercase with colon and optional dashes)'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: entity not found

    Conflict:
      description: Version conflict (optimistic locking)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: 'version conflict: expected 5, actual 7'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: internal server error

  schemas:
    Actor:
      type: object
      required:
        - user_id
        - actor_type
      properties:
        user_id:
          type: string
          example: patient-zero
        actor_type:
          type: string
          enum: [human, llm, system]
          default: human

    BatchResponse:
      type: object
      required:
        - results
        - total
        - success_count
        - failure_count
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchResult'
        total:
          type: integer
          example: 10
        success_count:
          type: integer
          example: 8
        failure_count:
          type: integer
          example: 2

    BatchResult:
      type: object
      required:
        - index
        - success
      properties:
        index:
          type: integer
          description: Index in batch array
        success:
          type: boolean
        result:
          $ref: '#/components/schemas/Message'
        error:
          type: string
          description: Error message if success is false

    ChangePhasePayload:
      type: object
      required:
        - phase
      properties:
        phase:
          type: string
          enum: [explore, code, validate, analyze]

    Chart:
      type: object
      required:
        - id
        - healthy
        - version
        - project_id
        - name
        - description
        - query
        - spec
        - pinned
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        healthy:
          type: boolean
        version:
          type: integer
        project_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        query:
          type: string
          description: Query specification for chart data
        spec:
          $ref: '#/components/schemas/ChartSpec'
        pinned:
          type: boolean

    ChartSpec:
      type: object
      required:
        - type
        - x
        - y
      properties:
        type:
          type: string
          enum: [bar, line, area, pie, heatmap, table]
        x:
          type: string
          description: X-axis field or dimension
        y:
          type: string
          description: Y-axis field or measure
        color:
          type: string
          description: Color field for grouping
        series:
          type: string
          description: Series field for multiple data sets
        orientation:
          type: string
          enum: [vertical, horizontal]
        stacked:
          type: boolean
          default: false
        show_legend:
          type: boolean
          default: false

    Code:
      type: object
      required:
        - id
        - healthy
        - version
        - project_id
        - slug
        - color
        - definition
        - pinned
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        healthy:
          type: boolean
        version:
          type: integer
        project_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        slug:
          type: string
          pattern: '^[a-z]+(-[a-z]+)*:[a-z]+(-[a-z]+)*$'
          minLength: 3
          maxLength: 100
          example: emotion:anxiety
          description: 'CRITICAL: Only lowercase letters (a-z) and hyphens allowed. NO numbers. Format: category:subcategory'
        color:
          type: string
          enum:
            - gray
            - mauve
            - slate
            - sage
            - olive
            - sand
            - tomato
            - red
            - ruby
            - crimson
            - pink
            - plum
            - purple
            - violet
            - iris
            - indigo
            - blue
            - cyan
            - teal
            - jade
            - green
            - grass
            - bronze
            - gold
            - brown
            - orange
            - amber
            - yellow
            - lime
            - mint
            - sky
          description: Radix UI color scheme
        definition:
          type: string
          description: Core definition (1-2 paragraphs max)
        inclusion_criteria:
          type: string
          description: When to apply this code (1-2 paragraphs max)
        exclusion_criteria:
          type: string
          description: When NOT to apply (1 paragraph max)
        examples:
          type: array
          items:
            type: string
          description: 3-5 representative text snippets
        counter_examples:
          type: array
          items:
            type: string
          description: 2-3 snippets that don't fit
        pinned:
          type: boolean

    CodedSection:
      type: object
      required:
        - code_id
        - text
        - confidence
        - last_actor
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        code_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        text:
          type: string
          minLength: 1
          maxLength: 1500
        reason:
          type: string
          maxLength: 1500
        confidence:
          type: string
          enum: [high, medium, low]
        last_actor:
          $ref: '#/components/schemas/Actor'

    CodedSectionView:
      type: object
      required:
        - id
        - file_id
        - file_name
        - code_id
        - text
        - reason
        - confidence
        - last_actor
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        file_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        file_name:
          type: string
        code_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        text:
          type: string
          minLength: 1
          maxLength: 1500
        reason:
          type: string
          maxLength: 1500
        confidence:
          type: string
          enum: [high, medium, low]
        last_actor:
          $ref: '#/components/schemas/Actor'

    CreateChartPayload:
      type: object
      required:
        - project_id
        - name
        - description
        - query
        - spec
      properties:
        project_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        query:
          type: string
        spec:
          $ref: '#/components/schemas/ChartSpec'

    CreateCodePayload:
      type: object
      required:
        - project_id
        - slug
        - color
        - definition
      properties:
        project_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        slug:
          type: string
          pattern: '^[a-z]+(-[a-z]+)*:[a-z]+(-[a-z]+)*$'
          minLength: 3
          maxLength: 100
          example: emotion:anxiety
          description: 'CRITICAL: Only lowercase letters (a-z) and hyphens allowed. NO numbers.'
        color:
          type: string
          enum:
            - gray
            - mauve
            - slate
            - sage
            - olive
            - sand
            - tomato
            - red
            - ruby
            - crimson
            - pink
            - plum
            - purple
            - violet
            - iris
            - indigo
            - blue
            - cyan
            - teal
            - jade
            - green
            - grass
            - bronze
            - gold
            - brown
            - orange
            - amber
            - yellow
            - lime
            - mint
            - sky
        definition:
          type: string
        inclusion_criteria:
          type: string
        exclusion_criteria:
          type: string
        examples:
          type: array
          items:
            type: string
        counter_examples:
          type: array
          items:
            type: string

    CreateFilePayload:
      type: object
      required:
        - project_id
        - name
        - description
        - content
      properties:
        project_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        content:
          type: string
        type:
          type: string
          enum: [corpus, codebook, memo, llm-memo]
          default: corpus

    CreateProjectPayload:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        phase:
          type: string
          enum: [explore, code, validate, analyze]
          default: explore

    CursorResult_Message:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_cursor:
          type: string
        has_more:
          type: boolean

    CursorResult_SearchResult:
      type: object
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        next_cursor:
          type: string
        has_more:
          type: boolean

    EditFileContentPayload:
      type: object
      required:
        - old_text
        - new_text
      properties:
        old_text:
          type: string
        new_text:
          type: string

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    File:
      type: object
      required:
        - id
        - healthy
        - version
        - project_id
        - name
        - description
        - type
        - locked
        - pinned
        - content
        - codes
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        healthy:
          type: boolean
        version:
          type: integer
        project_id:
          type: string
          pattern: '^[a-z0-9_]{26,27}$'
        name:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        title:
          type: string
          maxLength: 200
